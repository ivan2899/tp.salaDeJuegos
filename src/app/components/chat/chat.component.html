<div class="chat-window">

  <div class="chat-header">
    <img src="https://wwgfysczkcuaqjmpqkxo.supabase.co/storage/v1/object/public/images/extra/chatOpenIcon.png" alt="">
    <h5>Chat</h5>
  </div>

  <div class="chat-body" #chatBody>
    <div *ngFor="let msg of messages" class="message" [ngClass]="msg.type">
      <div class="msg-meta">
        <span class="msg-email" *ngIf="msg.email">{{ msg.email }}</span>
        <span class="msg-date">{{ msg.created_at | date:'dd/MM/yyyy' }}</span>
      </div>

      <div class="msg-text">{{ msg.text }}</div>

      <div class="msg-time">{{ msg.created_at | date:'shortTime' }}</div>
    </div>
  </div>
  
  <div class="chat-footer">
    <input type="text" placeholder="Escribe un mensaje..." [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" />
    <button class="send-btn" (click)="sendMessage()">➤</button>
  </div>
</div>
